    value: GrunnvannOppkomme
  - property: inheritsFrom
    value: FellesegenskaperGrunnvannBorehull
  properties:
  - name: datauttaksdato
    logicalType: timestamp
    description: 'dato for uttak fra en database


      Merknad:

      Skiller seg fra Kopidato ved at en ikke skiller på om det er uttak fra en originaldatabase
      eller en kopidatabase.'
    required: true
  - name: posisjon
    logicalType: string
    description: objektet har punktgeometri
    required: true
  - name: oppkomNr
    logicalType: integer
    description: oppkommets nummer i Nasjonal Grunnvannsdatabase
    required: true
  - name: geolMedium
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Løsmasse|Fjell)$
    customProperties:
    - property: allowedValues
      value:
      - value: Løsmasse
        label: Løsmasse
      - value: Fjell
        label: Fjell
    description: 'definerer om et borehull er boret slik at den blir permanent åpen;
      et stykke ned i fjellgrunnen (fjell) eller kun i løsmasser (løsmasse).


      I dette tilfellet definerer den om et oppkommet forekommer i løsmasse eller
      i fjell'
    required: true
  - name: oppkomVannføring
    logicalType: number
    description: oppkommets vanngiverevne målt i liter/time målt ved registrering.
      (vil variere)
  - name: oppkomBruk
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Vannforsyning|Undersøkelse|Ukjent)$
