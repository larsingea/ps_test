# Open Data Contract Standard (ODCS) v3.1.0 — generert fra datamodellen.
apiVersion: v3.1.0
kind: DataContract
id: urn:odcs:grunnvannsborehull-datamodell-uml-gunnvann:1.0.0
version: 1.0.0
status: active
name: Grunnvannsborehull - Datamodell UML Gunnvann
schema:
- name: LGNBrønn
  physicalName: lgnbr_nn
  logicalType: object
  physicalType: table
  description: brønn som benyttes eller har vært benyttet under monitorering av upåvirkede
    grunnvannsakviferer ("Landsomfattende grunnvannsnett - LGN" -http://www.grunnvann.no/overvaking_eks.php)
  customProperties:
  - property: sosiObjektType
    value: LGNBrønn
  - property: inheritsFrom
    value: GrunnvannBorehull
  - property: associations
    value:
    - role: referansepunkt
      target: LGNOmrådeRefPkt
      cardinality: '1'
  properties:
  - name: datauttaksdato
    logicalType: timestamp
    description: 'dato for uttak fra en database


      Merknad:

      Skiller seg fra Kopidato ved at en ikke skiller på om det er uttak fra en originaldatabase
      eller en kopidatabase.'
    required: true
  - name: posisjon
    logicalType: string
    description: objektet har punktgeometri
    required: true
  - name: brønnNr
    logicalType: integer
    description: brønnummer i NGUs database
    required: true
  - name: geolMedium
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Løsmasse|Fjell)$
    customProperties:
    - property: allowedValues
      value:
      - value: Løsmasse
        label: Løsmasse
      - value: Fjell
        label: Fjell
    description: definerer om et borehull er boret slik at den blir permanent åpen;
      et stykke ned i fjellgrunnen (fjell) eller kun i løsmasser (løsmasse).
    required: true
  - name: stedfestelseMetodeInfo
    logicalType: string
    description: stedfestelsesmetode, for eksempel GPS, kart med flere. Fram til ca
      2000 finnes en del registreringer som avviker betydelig fra brønnhullets reelle
      koordinater.
    required: true
  - name: oppdragstaker
    logicalType: string
    description: navn på borefirma som har utført boringen
    required: true
  - name: brønnBrukOmfang
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Enkelthusholdning|Gårdsbruk|Turistnæring|Hytte/fritidsbolig|Næringsmiddelproduksjon|Annen\
        industri|Vannverk|Vanningsanlegg|Vannforsyning|Miljøundersøkelser/overvåkning|Større\
        anlegg|Undersøkelse\ for\ energibrønn/anlegg|Undersøkelse\ for\ vannforsyning|Forskning|Ukjent)$
    customProperties:
    - property: allowedValues
      value:
      - value: Enkelthusholdning
        label: Enkelthusholdning
      - value: Gårdsbruk
        label: Gårdsbruk
      - value: Turistnæring
        label: Turistnæring
      - value: Hytte/fritidsbolig
        label: Hytte/fritidsbolig
      - value: Næringsmiddelproduksjon
        label: Næringsmiddelproduksjon
      - value: Annen industri
        label: Annen industri
      - value: Vannverk
        label: Vannverk
      - value: Vanningsanlegg
        label: Vanningsanlegg
      - value: Vannforsyning
        label: Vannforsyning
      - value: Miljøundersøkelser/overvåkning
        label: Miljøundersøkelser/overvåkning
      - value: Større anlegg
        label: Større anlegg
      - value: Undersøkelse for energibrønn/anlegg
        label: Undersøkelse for energibrønn/anlegg
      - value: Undersøkelse for vannforsyning
        label: Undersøkelse for vannforsyning
      - value: Forskning
        label: Forskning
      - value: Ukjent
        label: Ukjent
    description: hvor omfattende vannforsyningen er (til enkelthusholdning, gårdsbruk
      osv.)
  - name: boreDato
    logicalType: date
    description: dato for boringen
  - name: konsulentFirma
    logicalType: string
    description: konsulentfirma, som for eksempel har valgt ut borelokalitet, eller
      som har utredet aspekter ved bruk av brønnen.
  - name: rapport
    logicalType: array
    items:
      logicalType: string
    description: referanse til NGU-rapporter, samt VRL46-rapporter (innrapportert
      til NGU ifm oppgaveplikt jf Vannressurslovens §46 4. ledd).
  - name: boretLengde
    logicalType: number
    description: total lengde av borehullets forløp, tilsvarer dyp ved vertikal boring
  - name: boretLengdeTilBerg
    logicalType: number
    description: dybde til berg som ikke er målt men basert på tolkning
  - name: vannstandBorehull
    logicalType: number
    description: stabil vannstand etter boring målt fra overflaten i meter.
  - name: datoVannstandBorehull
    logicalType: date
    description: dato for når vannstand etter boring er målt  (før eventuell kapasitetsøkning).
  - name: brønnHelningType
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Loddrett|Skrå|Horisontal)$
    customProperties:
    - property: allowedValues
      value:
      - value: Loddrett
        label: Loddrett
      - value: Skrå
        label: Skrå
      - value: Horisontal
        label: Horisontal
    description: hvilken type helning borehullet kan ha (grovinndeling)
  - name: diameterBorehull
    logicalType: integer
    description: borehullets diameter målt i millimeter. For fjellbrønner oppgis dominerende
      diameter på borhullet nedenfor foringsrørets avslutning.
  - name: boretHelningsgrad
    logicalType: integer
    description: borehullets hellning målt som avvik i grader fra loddlinje
  - name: boretAzimuth
    logicalType: integer
    description: helning hvor  90 grader er vertikalt , 0 grader er horisontalt
  - name: materialForingsrør
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Plast|Rustfritt\ stål|Stål|PVC|Damprør|PE)$
    customProperties:
    - property: allowedValues
      value:
      - value: Plast
        label: Plast
      - value: Rustfritt stål
        label: Rustfritt stål
      - value: Stål
        label: Stål
      - value: PVC
        label: PVC
      - value: Damprør
        label: Damprør
      - value: PE
        label: PE
    description: foringsrørets materialtype
  - name: lengdeForingsrør
    logicalType: number
    description: foringsrørets lengde i meter
  - name: boretKapasitet
    logicalType: number
    description: brønnens kapasitet ("vannføring") i liter/time før eventuell kapsitetsøkende
      trykking eller sprengning. Vanligvis målt nokså usikkert av boreren i forbindelse
      med selve boringen.
  - name: kapasMålemet
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Blåsing|Prøvepumping|Stigningstest)$
    customProperties:
    - property: allowedValues
      value:
      - value: Blåsing
        label: Blåsing
      - value: Prøvepumping
        label: Prøvepumping
      - value: Stigningstest
        label: Stigningstest
    description: beskriver målemetode brukt for å måle brønnens kapasitet (vanngiverevne).
      Hvis brønnen senere er trykket eller sprengt for å øke kapasiteten,  oppgis
      her den målemetoden som er brukt FØR denne kapasitetsøkningen.
  - name: kapasØkningType
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Trykking|Sprengning|Ukjent)$
    customProperties:
    - property: allowedValues
      value:
      - value: Trykking
        label: Trykking
      - value: Sprengning
        label: Sprengning
      - value: Ukjent
        label: Ukjent
    description: beskriver om brønnen er sprengt eller trykket for å øke kapasiteten
  - name: øktKapasitet
    logicalType: number
    description: brønnens kapasitet ("vannføring") i liter/time målt etter eventuell
      kapsitetsøkende trykking eller sprengning.
  - name: beskrivelse
    logicalType: string
    description: 'forklaring til objektet og undersøkelser utført på lokaliteten.

      Brønnborers generelle kommentarer til boringen, gitt på brønnskjema'
  - name: brønnFiler
    logicalType: string
    description: filer i alle formater (billedformater, pdf, excel, word m.fl.) som
      brønnborere og andre rapportører har lagt inn og knyttet til borehullet (brønnen).
  - name: målePunktNr
    logicalType: string
    description: 'Merking av observasjonspunkter (brønner og oppkommer) som forekommer
      i et LGNområde (LGN overvåkingsstasjon).


      En slags merkelapp/nummerering, men som også kan inneholde bokstaver. Tallverdier
      over 50 representerer oppkommer.'
    required: true
  - name: måleFrekvens
    logicalType: string
    description: hvor hyppig det blir utført målinger/ kjemiske analyser
  - name: kjemiskeAnalyser
    logicalType: string
    description: link til kjemiske analyser
  - name: driftStartMåling
    logicalType: string
    description: startmåned/år for innsamling av kjemiske data
  - name: driftStoppMåling
    logicalType: string
    description: sluttmåned/år for innsamling av kjemiske analyser
  - name: lgnNummer
    logicalType: integer
    description: angir NGUs stasjonsnummer i overvåkningsprogrammet "Landsomfattende
      grunnvannsnett" (LGN)
    required: true
