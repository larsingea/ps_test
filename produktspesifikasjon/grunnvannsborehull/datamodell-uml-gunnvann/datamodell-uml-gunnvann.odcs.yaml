    logicalTypeOptions:
      pattern: ^(Rør|Naturlig|Kum)$
    customProperties:
    - property: allowedValues
      value:
      - value: Rør
        label: Rør
      - value: Naturlig
        label: Naturlig
      - value: Kum
        label: Kum
