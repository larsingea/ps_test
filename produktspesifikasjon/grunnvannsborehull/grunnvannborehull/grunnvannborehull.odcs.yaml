# Open Data Contract Standard (ODCS) v3.1.0 — generert fra datamodellen.
apiVersion: v3.1.0
kind: DataContract
id: urn:odcs:grunnvannsborehull-grunnvannborehull:1.0.0
version: 1.0.0
status: active
name: Grunnvannsborehull - Grunnvannborehull
schema:
- name: BrønnPark
  physicalName: br_nnpark
  logicalType: object
  physicalType: table
  description: Anlegg for uttak og/eller deponering av grunnvarme. Anlegg må ha tilsluttet
    minst fem energibrønner for å falle inn under NGUs definisjon av "Brønnpark".
  customProperties:
  - property: sosiObjektType
    value: BrønnPark
  - property: defaultCrs
    value: EPSG:25833
  properties:
  - name: geometri
    logicalType: object
    physicalType: geometry(Point,25833)
    required: true
    customProperties:
    - property: geometryType
      value: Point
    - property: crs
      value: EPSG:25833
  - name: datauttaksdato
    logicalType: string
    description: Dato for uttak fra en database<br/>Merknad:<br/>Skiller seg fra Kopidato
      ved at en ikke skiller på om det er uttak fra en originaldatabase eller en kopidatabase.
    required: true
  - name: brønnParkNr
    logicalType: integer
    description: Brønnparknummer  i NGUs database
    required: true
    primaryKey: true
  - name: brønnpOmrNavn
    logicalType: string
    description: Lokalt stedsnavn der brønnparken ligger.
  - name: geolMedium
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Fjell|Løsmasse)$
    customProperties:
    - property: allowedValues
      value:
      - value: Fjell
        label: Fjell
      - value: Løsmasse
        label: Løsmasse
    description: "Definerer om et borehull er boret slik at den blir permanent åpen;\
      \ et stykke ned i fjellgrunnen (fjell) eller kun i løsmasser (løsmasse).\r\n\
      <br/>I dette tilfellet definerer den om brønnpark er basert på boringer kun\
      \ i løsmasse (vanligvis for oppumping av varmt grunnvann) eller også er  boret\
      \ videre ned i berggrunn (vanligvis varmeuttak via kollektorslanger)."
    required: true
  - name: antallEnergiBrønner
    logicalType: integer
    description: Beskriver antall energibrønner i brønnparken (minimum 5 for å defineres
      som brønnpark)
    required: true
  - name: brønnpKommentar
    logicalType: string
    description: Brønnboreres kommentarer om brønnparken
  - name: brønnpVEffekt
    logicalType: integer
    description: Brønnparkens maksimale varmeeffekt i kW
  - name: brønnpVEnergi
    logicalType: integer
    description: Brønnparkens maksimale varmeenergi i kWh/år
  - name: brønnpKEffekt
    logicalType: integer
    description: Brønnparkens maksimale kjøleeffekt i kW
  - name: brønnpKEnergi
    logicalType: integer
    description: Brønnparkens maksimale kjøleeffekt i kWh/år
  - name: brønnpFrikjøling
    logicalType: string
    description: Beskriver om brønnparken benyttes til frikjøling (ja/nei)
  - name: brønnpKollVæske
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Etanol|Etylenglykol|Kaliumformiat|Kaliumklorid|Metanol|Propylenglykol|Vann)$
    customProperties:
    - property: allowedValues
      value:
      - value: Etanol
        label: Etanol
      - value: Etylenglykol
        label: Etylenglykol
      - value: Kaliumformiat
        label: Kaliumformiat
      - value: Kaliumklorid
        label: Kaliumklorid
      - value: Metanol
        label: Metanol
      - value: Propylenglykol
        label: Propylenglykol
      - value: Vann
        label: Vann
    description: Beskriver type kollektorvæske (Metanol osv)
  - name: energibrønn
    logicalType: object
    properties:
    - name: href
      logicalType: string
    - name: rel
      logicalType: string
    - name: type
      logicalType: string
    - name: title
      logicalType: string
  - name: rapport-HTML
    logicalType: object
    properties:
    - name: href
      logicalType: string
    - name: rel
      logicalType: string
    - name: type
      logicalType: string
    - name: title
      logicalType: string
  - name: rapport-JSON
    logicalType: object
    properties:
    - name: href
      logicalType: string
    - name: rel
      logicalType: string
    - name: type
      logicalType: string
    - name: title
      logicalType: string
- name: EnergiBrønn
  physicalName: energibr_nn
  logicalType: object
  physicalType: table
  description: Grunnvannborehull som helt eller delvis er dedikert for uttak eller
    deponering av grunnvarme, enten gjennom kollektorslanger eller pumping av grunnvann
    hvis temperatur benyttes til oppvarming eller avkjøling.
  customProperties:
  - property: sosiObjektType
    value: EnergiBrønn
  - property: defaultCrs
    value: EPSG:25833
  properties:
  - name: geometri
    logicalType: object
    physicalType: geometry(Point,25833)
    required: true
    customProperties:
    - property: geometryType
      value: Point
    - property: crs
      value: EPSG:25833
  - name: datauttaksdato
    logicalType: string
    description: Dato for uttak fra en database<br/>Merknad:<br/>Skiller seg fra Kopidato
      ved at en ikke skiller på om det er uttak fra en originaldatabase eller en kopidatabase.
    required: true
  - name: brønnNr
    logicalType: integer
    description: Brønnummer i NGUs database
    required: true
    primaryKey: true
  - name: geolMedium
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Fjell|Løsmasse)$
    customProperties:
    - property: allowedValues
      value:
      - value: Fjell
        label: Fjell
      - value: Løsmasse
        label: Løsmasse
    description: Definerer om et borehull er boret slik at den blir permanent åpen;
      et stykke ned i fjellgrunnen (fjell) eller kun i løsmasser (løsmasse).
    required: true
  - name: stedfestelseMetodeInfo
    logicalType: string
    description: Stedfestelsesmetode, for eksempel GPS, kart med flere. Fram til ca
      2000 finnes en del registreringer som avviker betydelig fra brønnhullets reelle
      koordinater.
    required: true
  - name: oppdragstaker
    logicalType: string
    description: Navn på borefirma som har utført boringen
    required: true
  - name: brønnBrukOmfang
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Annen\ industri|Enkelthusholdning|Forskning|Gårdsbruk|Hytte/fritidsbolig|Miljøundersøkelser/overvåkning|Næringsmiddelproduksjon|Større\
        anlegg|Turistnæring|Ukjent|Undersøkelse\ for\ energibrønn/anlegg|Undersøkelse\
        for\ vannforsyning|Vannforsyning|Vanningsanlegg|Vannverk)$
    customProperties:
    - property: allowedValues
      value:
      - value: Annen industri
        label: Annen industri
      - value: Enkelthusholdning
        label: Enkelthusholdning
      - value: Forskning
        label: Forskning
      - value: Gårdsbruk
        label: Gårdsbruk
      - value: Hytte/fritidsbolig
        label: Hytte/fritidsbolig
      - value: Miljøundersøkelser/overvåkning
        label: Miljøundersøkelser/overvåkning
      - value: Næringsmiddelproduksjon
        label: Næringsmiddelproduksjon
      - value: Større anlegg
        label: Større anlegg
      - value: Turistnæring
        label: Turistnæring
      - value: Ukjent
        label: Ukjent
      - value: Undersøkelse for energibrønn/anlegg
        label: Undersøkelse for energibrønn/anlegg
      - value: Undersøkelse for vannforsyning
        label: Undersøkelse for vannforsyning
      - value: Vannforsyning
        label: Vannforsyning
      - value: Vanningsanlegg
        label: Vanningsanlegg
      - value: Vannverk
        label: Vannverk
    description: Hvor omfattende vannforsyningen er (til enkelthusholdning, gårdsbruk
      osv.)
  - name: boreDato
    logicalType: string
    description: Dato for boringen
  - name: konsulentFirma
    logicalType: string
    description: Konsulentfirma, som for eksempel har valgt ut borelokalitet, eller
      som har utredet aspekter ved bruk av brønnen.
  - name: boretLengde
    logicalType: number
    description: Total lengde av borehullets forløp, tilsvarer dyp ved vertikal boring
  - name: boretLengdeTilBerg
    logicalType: number
    description: Dybde til berg som ikke er målt men basert på tolkning
  - name: vannstandBorehull
    logicalType: number
    description: Stabil vannstand etter boring målt fra overflaten i meter.
  - name: datoVannstandBorehull
    logicalType: string
    description: Dato for når vannstand etter boring er målt  (før eventuell kapasitetsøkning).
  - name: brønnHelningType
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Horisontal|Loddrett|Skrå)$
    customProperties:
    - property: allowedValues
      value:
      - value: Horisontal
        label: Horisontal
      - value: Loddrett
        label: Loddrett
      - value: Skrå
        label: Skrå
    description: Hvilken type helning borehullet kan ha (grovinndeling)
  - name: diameterBorehull
    logicalType: integer
    description: Borehullets diameter målt i millimeter. For fjellbrønner oppgis dominerende
      diameter på borhullet nedenfor foringsrørets avslutning.
  - name: boretHelningsgrad
    logicalType: integer
    description: Borehullets hellning målt som avvik i grader fra loddlinje
  - name: boretAzimuth
    logicalType: integer
    description: Helning hvor  90 grader er vertikalt , 0 grader er horisontalt
  - name: materialForingsrør
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Damprør|PE|PVC|Plast|Rustfritt\ stål|Stål)$
    customProperties:
    - property: allowedValues
      value:
      - value: Damprør
        label: Damprør
      - value: PE
        label: PE
      - value: PVC
        label: PVC
      - value: Plast
        label: Plast
      - value: Rustfritt stål
        label: Rustfritt stål
      - value: Stål
        label: Stål
    description: Foringsrørets materialtype
  - name: lengdeForingsrør
    logicalType: number
    description: Foringsrørets lengde i meter
  - name: boretKapasitet
    logicalType: number
    description: Brønnens kapasitet ("vannføring") i liter/time før eventuell kapsitetsøkende
      trykking eller sprengning. Vanligvis målt nokså usikkert av boreren i forbindelse
      med selve boringen.
  - name: kapasMålemet
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Blåsing|Prøvepumping|Stigningstest)$
    customProperties:
    - property: allowedValues
      value:
      - value: Blåsing
        label: Blåsing
      - value: Prøvepumping
        label: Prøvepumping
      - value: Stigningstest
        label: Stigningstest
    description: Beskriver målemetode brukt for å måle brønnens kapasitet (vanngiverevne).
      Hvis brønnen senere er trykket eller sprengt for å øke kapasiteten,  oppgis
      her den målemetoden som er brukt FØR denne kapasitetsøkningen.
  - name: kapasØkningType
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Sprengning|Trykking|Ukjent)$
    customProperties:
    - property: allowedValues
      value:
      - value: Sprengning
        label: Sprengning
      - value: Trykking
        label: Trykking
      - value: Ukjent
        label: Ukjent
    description: Beskriver om brønnen er sprengt eller trykket for å øke kapasiteten
  - name: øktKapasitet
    logicalType: number
    description: Brønnens kapasitet ("vannføring") i liter/time målt etter eventuell
      kapsitetsøkende trykking eller sprengning.
  - name: beskrivelse
    logicalType: string
    description: "Forklaring til objektet og undersøkelser utført på lokaliteten.\r\
      \nBrønnborers generelle kommentarer til boringen, gitt på brønnskjema"
  - name: brønnParkNr
    logicalType: integer
    description: Brønnparknummer  i NGUs databaser
  - name: brønnpark
    logicalType: object
    properties:
    - name: href
      logicalType: string
    - name: rel
      logicalType: string
    - name: type
      logicalType: string
    - name: title
      logicalType: string
  - name: rapport-HTML
    logicalType: object
    properties:
    - name: href
      logicalType: string
    - name: rel
      logicalType: string
    - name: type
      logicalType: string
    - name: title
      logicalType: string
  - name: rapport-JSON
    logicalType: object
    properties:
    - name: href
      logicalType: string
    - name: rel
      logicalType: string
    - name: type
      logicalType: string
    - name: title
      logicalType: string
