      \ være styrt av temaets samfunnsmessige betydning, områdets arealmessige betydning\
      \ eller prosjektets økonomi. Med nøyaktighet i denne sammenheng menes hvor korrekt\
      \ registreringen avspeiler objektets posisjon i naturen og presisjonen i valg\
      \ av tematisk innhold i forhold til generalisering\r\n<br/>Merknad: Tematisk\
      \ oppløsning/generaliseringsgrad kan være styrt av temaets samfunnsmessige betydning,\
      \ områdets arealmessige betydning eller prosjektets målsetning"
  - name: identifikasjon
    logicalType: object
    properties:
    - name: lokalId
      logicalType: string
      description: 'Lokal identifikator, tildelt av dataleverendør/dataforvalter.
        Den lokale identifikatoren er unik innenfor navnerommet, ingen andre objekter
        har samme identifikator.<br/>NOTE: Det er data leverendørens ansvar å sørge
        for at denne lokale identifikatoren er unik innenfor navnerommet.'
    - name: navnerom
      logicalType: string
      description: "Navnerom som unikt identifiserer datakilden til objektet, starter\
        \ med to bokstavs kode jfr ISO 3166. Benytter understreking  (\"_\") dersom\
        \ data produsenten ikke er assosiert med bare et land.\r\n<br/>NOTE 1 : Verdien\
        \ for nanverom vil eies av den dataprodusent som har ansvar for de unike identifikatorene\
        \ og vil registreres i \"INSPIRE external  Object Identifier Namespaces Register\"\
        <br/>Eksempel: NO for Norge."
    - name: versjonId
      logicalType: string
      description: Identifikasjon av en spesiell versjon av et geografisk objekt (instans),
        maksimum lengde på 25 karakterers. Dersom spesifikasjonen av et geografisk
        objekt med en identifikasjon inkludererer livsløpssyklusinformasjon, benyttes
        denne versjonId for å skille mellom ulike versjoner av samme objekt. versjonId
        er en unik  identifikasjon av versjonen. <br/>NOTE Maksimum lengde er valgt
        for å tillate tidsregistrering i henhold til  ISO 8601, slik som  "2007-02-12T12:12:12+05:30"
        som versjonId.
