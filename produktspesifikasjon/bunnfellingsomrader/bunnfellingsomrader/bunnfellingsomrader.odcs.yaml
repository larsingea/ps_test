      logicalType: string
      description: "Navnerom som unikt identifiserer datakilden til objektet, starter\
        \ med to bokstavs kode jfr ISO 3166. Benytter understreking  (\"_\") dersom\
        \ data produsenten ikke er assosiert med bare et land.\r\n<br/>NOTE 1 : Verdien\
        \ for nanverom vil eies av den dataprodusent som har ansvar for de unike identifikatorene\
        \ og vil registreres i \"INSPIRE external  Object Identifier Namespaces Register\"\
        <br/>Eksempel: NO for Norge."
