schema:
- name: BunnfellingOmr
  physicalName: bunnfellingomr
  logicalType: object
  physicalType: table
  description: 'Datasettet viser områder på havbunnen, der de kartlagte bunntypene
    tyder på rolige avsetningsforhold med lite strøm. Kartet over bunnfellingsområder
    er basert på tolkninger av bunnsedimenter (kornstørrelse), og representerer områder
    med avsetning av de fineste sedimentene: leir og silt i ulike prosentvise sammensetninger
    stedvis med en liten andel av fin sand. Detaljnivået på datasettet tilsier bruk
    innenfor kartmålestokken: 1:10 000 - 1:50 000.'
  customProperties:
  - property: sosiObjektType
    value: BunnfellingOmr
  - property: defaultCrs
    value: EPSG:4258
  properties:
  - name: geometri
    logicalType: object
    physicalType: geometry(Polygon,4258)
    required: true
    customProperties:
    - property: geometryType
      value: Polygon
    - property: crs
      value: EPSG:4258
